name: Controllo sicurezza settimanale
on:
  schedule:
    - cron: '0 9 * * 5'
      timezone: 'Europe/Rome'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-audit.yml'
      - '.gitleaks.toml'
      - 'scripts/security-audit.mjs'
      - 'tests/security-audit.test.mjs'
      - 'supabase/functions/weekly-security-audit/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: barberup-security-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'MISCIANDOSKY/BarberUp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test del controllo e dei vincoli OIDC
        run: node --test tests/security-audit.test.mjs
      - name: Installa scanner verificato
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scansione sicurezza e report senza dati sensibili
        run: node scripts/security-audit.mjs
      - name: Rimuovi report temporanei
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/security-leaks.json"

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151815" />
    <script>
      (() => {
        let theme = "dark";
        try {
          if (localStorage.getItem("barberup-theme") === "light")
            theme = "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#f7f6f2" : "#151815");
      })();
    </script>
    <meta
      name="description"
      content="BarberUp — prenota il tuo prossimo taglio, in pochi gesti."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>BarberUp · Il tuo tempo, il tuo stile</title>
  </head>
  <body>
    <div id="root">
      <p
        style="
          font-family: system-ui;
          padding: 3rem;
          background: var(--bg, #151815);
          color: var(--text, #f5f2ea);
        "
      >
        BarberUp · Caricamento…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

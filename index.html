<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151815" />
    <script>
      (() => {
        let preference = "dark";
        try {
          const stored = localStorage.getItem("barberup-theme");
          if (stored === "light" || stored === "auto") preference = stored;
        } catch {}
        let theme = preference;
        if (preference === "auto") {
          theme = "dark";
          try {
            if (!window.matchMedia("(prefers-color-scheme: dark)").matches)
              theme = "light";
          } catch {}
        }
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#f7f6f2" : "#151815");
      })();
    </script>
    <meta
      name="description"
      content="Prenota il tuo prossimo taglio, in pochi gesti."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
